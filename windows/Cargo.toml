[package]
name = "claude-cn-windows"
version = "1.0.0"
edition = "2021"
description = "Claude Desktop 一键汉化助手 (Windows)"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[build-dependencies]
winres = "0.1"

[profile.release]
strip = true
lto = true
opt-level = "s"
