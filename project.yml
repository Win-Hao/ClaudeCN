name: ClaudeCN
options:
  bundleIdPrefix: com.claudecn
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
targets:
  ClaudeCN:
    type: application
    platform: macOS
    sources:
      - path: Sources/ClaudeCN
        excludes:
          - "zh-CN.json"
      - path: Sources/ClaudeCN/zh-CN.json
        buildPhase: resources
      - path: Sources/ClaudeCN/desktop-zh-CN.json
        buildPhase: resources
      - path: Sources/ClaudeCN/claude-Localizable.strings
        buildPhase: resources
      - path: Sources/ClaudeCN/statsig-zh-CN.json
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Sources/ClaudeCN/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.claudecn.app
        PRODUCT_NAME: ClaudeCN
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Sources/ClaudeCN/ClaudeCN.entitlements
      properties: {}
